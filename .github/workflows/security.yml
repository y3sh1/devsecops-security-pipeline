name: Security pipeline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: security-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install scanners
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "semgrep==1.187.0"
          curl -fsSL --retry 3 -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tar.gz" | sha256sum -c -
          mkdir -p scanner-bin
          tar -xzf trivy.tar.gz -C scanner-bin trivy
          echo "$RUNNER_TEMP/scanner-bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Scan checkout and apply policy
        run: python security/check.py --report "${{ runner.temp }}/reports/security.json"
      - name: Save redacted decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-decision
          path: ${{ runner.temp }}/reports/security.json
          if-no-files-found: warn
          retention-days: 7
      - name: Build service image
        run: docker build -t health-service:ci service
